<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manual de las DevTools</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/theme.js" defer></script>
    <script src="js/panic.js" defer></script>
    <script src="js/calculator.js" defer></script>
  </head>

  <body>
    <header>
      <div>
        <h1>Manual de las DevTools</h1>
      </div>
      <img src="images/oscuro.png" id="cambiarTema" alt="cambiar-tema" />
    </header>
    <div id="botonPanico">
      <p>HAZ CLICK 👉</p>
      <img src="images/botonPanico.png" alt="boton-panico" id="panico" />
    </div>

    <div id="calculator">
      <div>
        <h2>Calculadora</h2>
      </div>
      <div id="result">
        <div id="display"></div>
      </div>
      <div id="buttons">
        <div id="file1">
          <button>7</button>
          <button>8</button>
          <button>9</button>
          <button>x</button>
        </div>
        <div id="file2">
          <button>4</button>
          <button>5</button>
          <button>6</button>
          <button>-</button>
        </div>
        <div id="file3">
          <button>1</button>
          <button>2</button>
          <button>3</button>
          <button>+</button>
        </div>
        <div id="file4">
          <button>CE</button>
          <button>0</button>
          <button>.</button>
          <button>=</button>
        </div>
      </div>
    </div>
  </body>
</html>
